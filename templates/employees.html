{% extends "base.html" %}
{% block content %}
{% if errors %}
<ul style="color:red">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
{% endif %}
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input name="name" placeholder="Name" value="{{ form.get('name', '') }}" required>
  <input name="email" placeholder="Email" value="{{ form.get('email', '') }}">
  <input name="department" placeholder="Department" value="{{ form.get('department', '') }}" required>
  <input name="salary" type="number" min="0" step="any" placeholder="Salary" value="{{ form.get('salary', '') }}">
  <button>Add</button>
</form>
<table border="1" cellpadding="5">
  <tr><th>Name</th><th>Email</th><th>Department</th><th>Salary</th></tr>
  {% for r in rows %}<tr>{% for c in r %}<td>{{ c }}</td>{% endfor %}</tr>{% endfor %}
</table>
{% endblock %}
